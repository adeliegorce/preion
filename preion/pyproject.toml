[project]
name = "preion"
version = "0.1.0"
description = "Electron-density-based reionisation model and kSZ/tau/BB MCMC forecast pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "scipy",
    "astropy",
    "camb",
    "ipykernel",
]

[project.optional-dependencies]
forecast = [
    "matplotlib",
    "emcee",
    "h5py",
    "healpy",
    "arviz",
    "tqdm",
    "pyyaml",
    "plancklens @ git+https://github.com/carronj/plancklens",
]
test = ["pytest"]

[project.scripts]
preion-run-mcmc = "preion.forecast.mcmc:main"
preion-read-mcmc = "preion.forecast.read_mcmc:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises CAMB (via Pee_model(run_camb=True)) and is a few seconds per test",
]

[tool.uv.extra-build-dependencies]
plancklens = ["scikit_build_core"]
